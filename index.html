<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tray Control</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .top-text {
      position: absolute;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #ddd;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .box {
      background: #1b1b1b;
      padding: 28px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      min-width: 480px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 520px;
    }

    button {
      border: none;
      border-radius: 12px;
      background: #2d2d2d;
      color: white;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #3b3b3b;
      transform: translateY(-2px);
    }

    .letter-btn {
      width: 56px;
      height: 56px;
      font-size: 22px;
    }

    .input-area {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    #customInput {
      width: 240px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: #2d2d2d;
      color: white;
      font-size: 18px;
      text-align: center;
      outline: none;
      padding: 0 12px;
    }

    #customInput::placeholder {
      color: #777;
      font-size: 14px;
    }

    .send-btn {
      width: 86px;
      height: 44px;
      font-size: 15px;
      font-weight: bold;
    }

    #status {
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
      min-height: 18px;
    }

    .small {
      margin-top: 10px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .box {
        min-width: auto;
        width: 85%;
        padding: 24px;
      }

      .top-text {
        top: 55px;
        font-size: 24px;
      }

      .input-area {
        flex-direction: column;
        align-items: center;
      }

      #customInput {
        width: 220px;
      }

      .send-btn {
        width: 220px;
      }
    }
  </style>
</head>

<body>
  <div class="top-text">MEHMET</div>

  <div class="box">
    <h1>Tray Control</h1>

    <div class="buttons">
      <button class="letter-btn" onclick="sendMessage('A')">A</button>
      <button class="letter-btn" onclick="sendMessage('B')">B</button>
      <button class="letter-btn" onclick="sendMessage('C')">C</button>
      <button class="letter-btn" onclick="sendMessage('D')">D</button>
      <button class="letter-btn" onclick="sendMessage('E')">E</button>
      <button class="letter-btn" onclick="sendMessage('G')">G</button>
      <button class="letter-btn" onclick="sendMessage('T')">T</button>
    </div>

    <div class="input-area">
      <input id="customInput" maxlength="80" placeholder="Write anything..." />
      <button class="send-btn" onclick="sendCustomText()">SEND</button>
    </div>

    <div id="status">Waiting...</div>
    <div class="small">Button or input text will appear in the tray.</div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://tray-5eab6-default-rtdb.europe-west1.firebasedatabase.app";

    async function sendMessage(message) {
      const status = document.getElementById("status");

      try {
        const response = await fetch(`${FIREBASE_DB_URL}/tray/message.json`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(message)
        });

        if (!response.ok) {
          throw new Error("Firebase write failed");
        }

        status.textContent = `Sent: ${message}`;
      } catch (error) {
        console.error(error);
        status.textContent = "Error sending message";
      }
    }

    async function sendCustomText() {
      const input = document.getElementById("customInput");
      let text = input.value.trim();

      if (text === "") {
        document.getElementById("status").textContent = "Please write something";
        return;
      }

      await sendMessage(text);
      input.value = "";
    }

    document.getElementById("customInput").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendCustomText();
      }
    });
  </script>
</body>
</html>
